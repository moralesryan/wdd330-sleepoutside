<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sleep Outside | North Face Alpine Guide 3-Person Tent</title>

  <!-- ALWAYS root path for Vite -->
  <link rel="stylesheet" href="/css/style.css" />

  <script src="/js/product.js" type="module"></script>
</head>

<body>

  <!-- IMPORTANT: dynamic header injection -->
  <header class="divider" id="main-header"></header>

  <main class="divider">

    <section class="product-detail">

      <!-- JS will override these -->
      <h2>Brand Name</h2>

      <h3 class="divider">Product Name</h3>

      <img
        id="productImage"
        class="divider"
        src="/images/camping-products.jpg"
        alt="Product image"
      />

      <p id="productPrice" class="product-card__price">$0.00</p>

      <p id="productColor" class="product__color">Color</p>

      <p id="productDesc" class="product__description">
        Description
      </p>

      <div class="product-detail__add">
        <button id="addToCart" data-id="">
          Add to Cart
        </button>
      </div>

    </section>

  </main>

  <footer id="main-footer"></footer>

</body>
</html>
