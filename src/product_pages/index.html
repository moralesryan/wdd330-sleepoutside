<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Product Details</title>

    <!-- CSS (relative path for Vite + Render compatibility) -->
    <link rel="stylesheet" href="../css/style.css" />

    <!-- JS (must match your actual ProductDetails entry file) -->
    <script src="../js/product.js" type="module"></script>
</head>

<body>

    <!-- HEADER (loaded dynamically by loadHeaderFooter) -->
    <header class="divider" id="main-header"></header>

    <main class="divider">

        <section class="product-detail">

            <!-- Brand -->
            <h2>Brand Name</h2>

            <!-- Product Name -->
            <h3 class="divider">Product</h3>

            <!-- Product Image (JS will replace this) -->
            <img id="productImage" class="divider" alt="Product image" />

            <!-- Price -->
            <p id="productPrice" class="product-card__price">
                $0.00
            </p>

            <!-- Color -->
            <p id="productColor" class="product__color">
                Color
            </p>

            <!-- Description -->
            <p id="productDesc" class="product__description">
                Description
            </p>

            <!-- Add to Cart -->
            <div class="product-detail__add">
                <button id="addToCart" data-id="">
                    Add to Cart
                </button>
            </div>

        </section>

    </main>

    <section id="comments-section" class="divider">
        <h2>Customer Comments</h2>
        <ul id="commentsList"></ul>
        <form id="commentForm">
            <label for="commentAuthor">Name</label>
            <input type="text" id="commentAuthor" required>
            <label for="commentText">Comment</label>
            <textarea id="commentText" required></textarea>
            <button type="submit">Submit Comment</button>
        </form>
    </section>


    <!-- FOOTER -->
    <footer id="main-footer"></footer>

</body>

</html>
