<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sleep Outside | Product Details</title>

  <!-- IMPORTANT: use root-relative path in Vite -->
  <link rel="stylesheet" href="/css/style.css" />

  <!-- IMPORTANT: must be module -->
  <script src="/js/product.js" type="module"></script>
</head>

<body>

  <!-- HEADER (JS will inject shared header if you use header module) -->
  <header class="divider" id="main-header"></header>

  <main class="divider">

    <section class="product-detail">

      <!-- These IDs are REQUIRED for product.js -->
      <h3 id="productBrand">Brand Name</h3>

      <h2 class="divider" id="productName">Product Name</h2>

      <img
        id="productImage"
        class="divider"
        src="/images/camping-products.jpg"
        alt="Product image"
      />

      <p id="productPrice" class="product-card__price">$0.00</p>

      <p id="productColor" class="product__color">Color</p>

      <p id="productDesc" class="product__description">Description</p>

      <div class="product-detail__add">
        <button id="addToCart" data-id="">
          Add to Cart
        </button>
      </div>

    </section>

  </main>

  <footer id="main-footer"></footer>

</body>

</html>
