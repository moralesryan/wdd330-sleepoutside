<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Product Listing</title>

  <!-- FIX: use relative paths -->
  <link rel="stylesheet" href="../css/style.css" />

  <script type="module" src="../js/product-listing.js"></script>
</head>

<body>

  <header class="divider" id="main-header"></header>

  <main class="divider">

    <section class="products">

      <h2 class="title">Top Products</h2>

      <ul class="product-list"></ul>

    </section>

  </main>

  <footer id="main-footer"></footer>

  <div id="quick-view-modal" class="hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-name">
      <div class="modal-image">
        <img id="modal-img" src="" alt="Product image">
      </div>

      <div class="modal-body">
        <button id="modal-close" aria-label="Close">✕</button>
        <div class="modal-meta">
          <h2 id="modal-brand"></h2>
          <h3 id="modal-name"></h3>
          <p id="modal-price"></p>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
