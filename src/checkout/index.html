<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sleep Outside | Checkout</title>

  <link rel="stylesheet" href="/css/style.css" />

  <script src="/js/checkout.js" type="module"></script>
</head>

<body>

  <!-- Dynamic Header -->
  <header class="divider" id="main-header"></header>

  <main class="divider">

    <nav aria-label="breadcrumb" class="breadcrumb-container">
      <ol id="breadcrumb" class="breadcrumb-list">

      </ol>
    </nav>
    <section class="products">

      <h2>Review &amp; Place Your Order</h2>

      <!-- Checkout items will render here -->
      <div id="checkout-list"></div>

      <!-- Order summary -->
      <div id="order-summary">
        <h2>Order Summary</h2>
        <p>Number of Items: <span id="num-items"></span></p>
        <p>Subtotal: <span id="cartTotal">$0.00</span></p>
        <p>Tax: <span id="tax">$0.00</span></p>
        <p>Shipping: <span id="shipping">$0.00</span></p>
        <p><b>Total: <span id="orderTotal">$0.00</span></b></p>

      </div>

      <!-- checkout form -->
      <div class="checkout">
        <form name="checkout-form">
          <input type="hidden" name="orderDate" id="orderDate">
          <fieldset>
            <legend></legend>
            <div class="checkout__name">
              <label for="fname">First Name</label>
              <input type="text" name="fname" id="fname" required>
              <label for="lname">Last Name</label>
              <input type="text" name="lname" id="lname" required>
            </div>
            <div class="checkout__address">
              <label for="street">Street Address</label>
              <input type="text" name="street" id="street" required>
              <label for="city">City</label>
              <input type="text" name="city" id="city" required>
              <label for="state">State</label>
              <input type="text" name="state" id="state" required>
              <label for="zip">Zip</label>
              <input type="text" name="zip" id="zip" required>
            </div>
          </fieldset>
          <fieldset>
            <legend>Payment</legend>
            <div class="checkout__payment">
              <label for="cardNumber">Card Number</label>
              <input type="text" name="cardNumber" id="cardNumber" required>
              <label for="expiration">Expiration</label>
              <input type="text" name="expiration" id="expiration" required>
              <label for="code">CVV</label>
              <input type="text" name="code" id="code" required>
            </div>
          </fieldset>
          <button type="submit" id="checkoutSubmit">Checkout</button>
        </form>
      </div>
    </section>

  </main>

  <!-- Dynamic Footer -->
  <footer id="main-footer"></footer>

</body>

</html>
