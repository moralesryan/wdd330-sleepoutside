<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sleep Outside | Checkout</title>

  <link rel="stylesheet" href="/css/style.css" />

  <script src="/js/checkout.js" type="module"></script>
</head>

<body>

  <!-- Dynamic Header -->
  <header class="divider" id="main-header"></header>

  <main class="divider">

    <section class="products">

      <h2>Review &amp; Place Your Order</h2>

      <!-- Checkout items will render here -->
      <div id="checkout-list"></div>

      <!-- Order summary -->
      <div id="order-summary">
        <h2>Order Summary</h2>
        <p>Subtotal: <span id="subtotal">$0.00</span></p>
        <p>Tax: <span id="tax">$0.00</span></p>
        <p>Shipping: <span id="shipping">$0.00</span></p>
        <p><b>Total: <span id="total">$0.00</span></b></p>

      </div>

      <!-- checkout form -->
      <div class="checkout">
        <form action="" method="post">
          <fieldset>
            <legend>Your Information</legend>
            <label for="name">Name: </label>
            <input type="text" id="name" aria-label="name" required>
            <label for="lname">Last Name: </label>
            <input type="text" id="lname" aria-label="lname" required>
          </fieldset>
          <fieldset>
            <legend>Shipping Address</legend>
            <label for="street-ad">Street Address: </label>
            <input type="text" id="street-ad" aria-label="street-ad" required>
            <label for="city">City: </label>
            <input type="text" id="city" aria-label="city" required>
            <label for="state">State: </label>
            <input type="text" id="state" aria-label="state" required>
            <label for="zip">Zip Code: </label>
            <input type="text" id="zip" aria-label="zip" required>
          </fieldset>
          <fieldset>
            <legend>Payment Information</legend>
            <label for="ccnum">Card Number: </label>
            <input type="text" id="ccnum" aria-label="ccnum" required>
            <label for="exp">Expiration Date: </label>
            <input type="text" id="exp" aria-label="exp" required>
            <label for="cvv">CVV: </label>
            <input type="text" id="cvv" aria-label="cvv" required>
          </fieldset>
          <button type="submit">Place Order</button>
        </form>
      </div>
    </section>

  </main>

  <!-- Dynamic Footer -->
  <footer id="main-footer"></footer>

</body>

</html>
