<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Outside | Home</title>

  <link rel="stylesheet" href="./css/style.css" />
  <script src="./js/main.js" type="module"></script>
</head>

<body>

  <header class="divider" id="main-header">
  </header>

  <main class="divider">
    <nav aria-label="breadcrumb" class="breadcrumb-container">
      <ol id="breadcrumb" class="breadcrumb-list">

      </ol>
    </nav>

    <!-- HERO SECTION -->
        <section class="hero">

        <!-- BACKGROUND IMAGE -->
        <img
          class="hero-img"
          src="./images/banner-sm.jpg"
          srcset="./images/banner-sm.jpg 500w, ./images/banner.jpg"
          alt="image of a high mountain lake"
        />

        <!-- HERO CONTENT OVERLAY -->
        <div class="hero-content">

          <!-- LOGO GROUP -->
          <div class="hero-logo">
            <img src="./images/noun_Tent_2517.svg" alt="tent image for logo" />
            <h1>Sleep<span>Outside</span></h1>
          </div>

          <!-- MISSION TEXT -->
          <p class="hero-mission">
            Our mission is to provide you with everything you need to sleep outside
            comfortably at an affordable price.
          </p>

        </div>

      </section>

    <!-- ✅ CATEGORY SECTION (NEW - REQUIRED) -->
        <section class="categories">

      <a href="product_listing/index.html?category=tents" class="category-card">
        <img src="./images/category-tents.svg" alt="Tents">
        <p>Tents</p>
      </a>

      <a href="product_listing/index.html?category=backpacks" class="category-card">
        <img src="./images/category-backpacks.svg" alt="Backpacks">
        <p>Backpacks</p>
      </a>

      <a href="product_listing/index.html?category=sleeping-bags" class="category-card">
        <img src="./images/category-sleepingbags.svg" alt="Sleeping Bags">
        <p>Sleeping Bags</p>
      </a>

      <a href="product_listing/index.html?category=hammocks" class="category-card">
        <img src="./images/category-hammocks.svg" alt="Hammocks">
        <p>Hammocks</p>
      </a>

        </section>

    <!-- PRODUCTS SECTION (DO NOT TOUCH) -->
    <section class="products">
      <h2>Top Products</h2>

      <!-- Dynamic products will be inserted here -->
      <ul class="product-list"></ul>

    </section>

  </main>

  <footer id="main-footer"></footer>

</body>

</html>
